<!DOCTYPE html>
<html lang="fi">
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeITL Harjoituskalenteri</title>
 
<script src="https://cdn.jsdelivrcalendar@6.1.17/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendares-all.global.min.jsscript"></script>
 
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
}
 
h1 {
color: #003366;
}
 
#calendar {
max-width: 1200px;
margin: 20px auto;
}
</style>
</head>
<body>
 
<h1>SeITL Harjoituskalenteri</h1>
 
<div id="calendar"></div>
 
<script>
document.addEventListener("DOMContentLoaded", function () {
 
fetch("./calendar.json")
.then(response => {
if (!response.ok) {
throw new Error(
"calendar.json ei löytynyt. HTTP " +
response.status
);
}
return response.json();
})
.then(events => {
 
const calendarEl =
document.getElementById("calendar");
 
const calendar =
new FullCalendar.Calendar(calendarEl, {
 
locale: "fi",
 
initialView: "dayGridMonth",
 
headerToolbar: {
left: "prev,next today",
center: "title",
right: "dayGridMonth,timeGridWeek,timeGridDay"
},
 
events: events
});
 
calendar.render();
})
.catch(error => {
 
console.error(error);
 
document.getElementById("calendar").innerHTML =
'<p class="error">Virhe: ' +
error.message +
'</p>';
});
});
</script>
 
</body>
</html>
