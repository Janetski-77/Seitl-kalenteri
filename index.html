<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
 
<title>Seitl Harjoituskalenteri</title>
 
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/locales"></script>
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
background: #f5f7fa;
}
 
h1 {
color: #003366;
}
 
#groupFilter {
margin-bottom: 15px;
padding: 8px;
font-size: 16px;
}
 
#calendar {
background: white;
padding: 10px;
border-radius: 10px;
box-shadow: 0 2px 10px rgba(0,0,0,.1);
}
 
.fc-event {
cursor: pointer;
}
 
.modal {
display: none;
position: fixed;
z-index: 9999;
left: 0;
top: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,.5);
}
 
.modal-content {
background: white;
margin: 10% auto;
padding: 20px;
width: 90%;
max-width: 500px;
border-radius: 10px;
}
 
.close {
float: right;
font-size: 24px;
cursor: pointer;
}
 
@media (max-width: 768px) {
body {
margin: 10px;
}
 
.modal-content {
width: 95%;
}
}
</style>
</head>
 
<body>
 
<h1>Seitl Harjoituskalenteri</h1>
 
<select id="groupFilter">
<option value="all">Kaikki ryhmät</option>
</select>
 
<div id="calendar"></div>
 
<div id="eventModal" class="modal">
<div class="modal-content">
<span class="close">&times;</span>
<div id="eventDetails"></div>
</div>
</div>
 
<script>
fetch("calendar.json")
.then(response => response.json())
.then(data => {
 
const groups = [...new Set(data.map(e => e.group))];
const filter = document.getElementById("groupFilter");
 
groups.forEach(group => {
const option = document.createElement("option");
option.value = group;
option.textContent = group;
filter.appendChild(option);
});
 
const calendarEl = document.getElementById("calendar");
 
const calendar = new FullCalendar.Calendar(calendarEl, {
locale: "fi",
 
initialView: "dayGridMonth",
 
height: "auto",
 
headerToolbar: {
left: "prev,next today",
center: "title",
right: "dayGridMonth,timeGridWeek,timeGridDay"
},
 
events: data,
 
eventClick: function(info) {
 
const e = info.event;
 
document.getElementById("eventDetails").innerHTML = `
<h2>${e.title}</h2>
<p><strong>Ryhmä:</strong> ${e.extendedProps.group || ""}</p>
<p><strong>Paikka:</strong> ${e.extendedProps.location || ""}</p>
<p><strong>Valmentaja:</strong> ${e.extendedProps.coach || ""}</p>
<p><strong>Kuvaus:</strong> ${e.extendedProps.description || ""}</p>
<p><strong>Alkaa:</strong> ${e.start.toLocaleString("fi-FI")}</p>
<p><strong>Päättyy:</strong> ${e.end ? e.end.toLocaleString("fi-FI") : ""}</p>
`;
 
document.getElementById("eventModal").style.display = "block";
}
});
 
calendar.render();
 
filter.addEventListener("change", function() {
 
const value = this.value;
 
calendar.removeAllEvents();
 
const filtered =
value === "all"
? data
: data.filter(e => e.group === value);
 
calendar.addEventSource(filtered);
});
})
.catch(error => {
console.error("Virhe ladattaessa calendar.json:", error);
});
 
document.querySelector(".close").onclick = function() {
document.getElementById("eventModal").style.display = "none";
};
 
window.onclick = function(event) {
const modal = document.getElementById("eventModal");
 
if (event.target === modal) {
modal.style.display = "none";
}
};
</script>
 
</body>
</html>
