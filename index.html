<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeITL Harjoituskalenteri</title>
 
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

 
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
background: #f5f7fa;
}
 
h1 {
color: #003366;
}
 
#groupFilter {
padding: 8px;
margin-bottom: 15px;
font-size: 16px;
}
 
#calendar {
max-width: 1400px;
margin: 0 auto;
background: white;
padding: 10px;
border-radius: 10px;
box-shadow: 0 2px 10px rgba(0,0,0,.1);
}

.fc-timegrid-event {
max-width: 150px;
}
 
.fc-event-title,
.fc-event-main {
white-space: normal !important;
word-wrap: break-word;
}

@media (max-width: 768px) {
 
body {
margin: 5px;
}
 
h1 {
font-size: 1.3rem;
}
 
#groupFilter,
#downloadIcs {
width: 100%;
box-sizing: border-box;
margin-bottom: 10px;
padding: 10px;
font-size: 16px;
}
 
#calendar {
padding: 5px;
}
 
.fc-toolbar {
flex-wrap: wrap !important;
}
 
.fc-toolbar-title {
font-size: 1rem !important;
}
 
.fc-button {
padding: 4px 8px !important;
font-size: 0.8rem !important;
}
 
.fc-timegrid-slot-label {
font-size: 0.75rem;
}
 
.fc-event {
font-size: 0.7rem;
}
}  
</style>
</head>
<body>
 
<h1>SeiTL Harjoituskalenteri</h1>
 
<label for="groupFilter">Ryhmä:</label>
<select id="groupFilter">
<option value="all">Kaikki ryhmät</option>
</select>

<button id="downloadIcs">
Lataa valitun ryhmän aikataulut ICS muodossa
</button>
 
<div id="calendar"></div>
 
<script>

let allEvents = [];
 
fetch("./calendar.json")
.then(response => response.json())
.then(events => {
 
allEvents = events;
 
const filter = document.getElementById("groupFilter");
 
const groups = [...new Set(
events.map(e => e.title)
)];
 
groups.sort();
 
groups.forEach(group => {
const option = document.createElement("option");
option.value = group;
option.textContent = group;
filter.appendChild(option);
});

  const mobile = window.innerWidth < 768;
 
const calendar = new FullCalendar.Calendar(
document.getElementById("calendar"),
{
locale: "fi",
 
firstDay: 1,
weekNumbers: true,
weekText: "Viikko", 
initialView: mobile ? "timeGridDay" : "timeGridWeek",

slotEventOverlap: true,
eventMaxStack: 10,
 
slotMinTime: "07:00:00",
slotMaxTime: "23:00:00",
 
expandRows: true,
 
headerToolbar: {
left: "prev,next",
center: "title",
right: mobile
? "timeGridDay"
: "dayGridMonth,timeGridWeek,timeGridDay"
},
 
events: allEvents,
 
eventContent: function(arg) {
 
if (mobile) {
return {
html: `<strong>${arg.event.title}</strong>`
};
}
 
return {
html: `
<div>
<strong>${arg.event.title}</strong><br>
${arg.event.extendedProps.location || ""}
</div>
`
};

}
}
);
 
calendar.render();
 
filter.addEventListener("change", function () {
 
const selectedGroup = this.value;
 
calendar.removeAllEvents();
 
const filtered =
selectedGroup === "all"
? allEvents
: allEvents.filter(
e => e.title === selectedGroup
);
 
calendar.addEventSource(filtered);
});
 
})
.catch(error => {
console.error(error);
 
document.getElementById("calendar").innerHTML =
"<p style='color:red'>Virhe: " +
error.message +
"</p>";
});

  document.getElementById("downloadIcs").addEventListener("click", function () {
 
const selectedGroup =
document.getElementById("groupFilter").value;
 
const events =
selectedGroup === "all"
? allEvents
: allEvents.filter(
e => e.title === selectedGroup
);
 
let ics =
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//SeITL//Kalenteri//FI
`;
 
events.forEach(event => {
 
const start =
event.start
.replace(/[-:]/g, "")
.replace(".000Z", "Z");
 
const end =
event.end
.replace(/[-:]/g, "")
.replace(".000Z", "Z");
 
ics +=
`BEGIN:VEVENT
SUMMARY:${event.title}
LOCATION:${event.location || ""}
DTSTART:${start}
DTEND:${end}
END:VEVENT
`;
});
 
ics += "END:VCALENDAR";
 
const blob =
new Blob([ics], {
type: "text/calendar;charset=utf-8"
});
 
const link = document.createElement("a");
 
link.href = URL.createObjectURL(blob);
 
link.download =
(selectedGroup === "all"
? "seitl-kalenteri"
: selectedGroup + "-harjoitukset")
+ ".ics";
 
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
});
 
</script>
 
</body>
</html>
