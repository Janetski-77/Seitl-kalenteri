<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>SeITL Harjoituskalenteri</title>
 
<script src="https://cdn.jsdelivr.net/npm@6.1.17/index.global.min.jsscript>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/locales-all.global>
 
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
background: #f5f7fa;
}
 
h1 {
color: #003366;
}
 
#groupFilter {
margin-bottom: 15px;
padding: 8px;
font-size: 16px;
}
 
#calendar {
background: white;
padding: 10px;
border-radius: 10px;
box-shadow: 0 2px 10px rgba(0,0,0,.1);
}
 
.modal {
display: none;
position: fixed;
z-index: 9999;
left: 0;
top: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,.5);
}
 
.modal-content {
background: white;
margin: 10% auto;
padding: 20px;
width: 90%;
max-width: 500px;
border-radius: 10px;
}
 
.close {
float: right;
font-size: 24px;
cursor: pointer;
}
 
@media (max-width: 768px) {
body {
margin: 10px;
}
 
.modal-content {
width: 95%;
}
}
</style>
</head>
 
<body>
 
<h1>SeITL Harjoituskalenteri</h1>
 
<select id="groupFilter">
<option value="all">Kaikki ryhmät</option>
</select>
 
<div id="calendar"></div>
 
<div id="eventModal" class="modal">
<div class="modal-content">
<span class="close">&times;</span>
<div id="eventDetails"></div>
</div>
</div>
 
<script>
let allEvents = [];
let calendar;
 
fetch("calendar.json")
.then(response => {
if (!response.ok) {
throw new Error("calendar.json ei löydy");
}
return response.json();
})
.then(data => {
 
allEvents = data;
 
const groups = [...new Set(
data
.map(item => item.group)
.filter(group => group)
)];
 
const filter = document.getElementById("groupFilter");
 
groups.forEach(group => {
const option = document.createElement("option");
option.value = group;
option.textContent = group;
filter.appendChild(option);
});
 
calendar = new FullCalendar.Calendar(
document.getElementById("calendar"),
{
locale: "fi",
 
initialView: "dayGridMonth",
 
headerToolbar: {
left: "prev,next today",
center: "title",
right: "dayGridMonth,timeGridWeek,timeGridDay"
},
 
events: data.map(event => ({
...event,
color:
event.status === "Peruttu" ? "#dc3545" :
event.status === "Siirretty" ? "#fd7e14" :
event.status === "Vahvistettu" ? "#198754" :
"#0d6efd"
})),
 
eventClick: function(info) {
 
const event = info.event;
 
document.getElementById("eventDetails").innerHTML = `
<h2>${event.title}</h2>
 
<p><strong>Ryhmä:</strong> ${event.extendedProps.group || ""}</p>
